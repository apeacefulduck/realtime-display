<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Shopping List Display</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-label="ESP32 shopping list display control">
        <div class="panel-header">
          <h1>ESP32 Live Display</h1>
          <p id="connectionStatus" class="status disconnected">
            <span aria-hidden="true">&bull;</span>
            Disconnected
          </p>
        </div>

        <nav class="tabs" aria-label="Display mode">
          <button id="shoppingTab" class="tab active" type="button">Alisveris</button>
          <button id="spotifyTab" class="tab" type="button">Spotify</button>
          <button id="weatherTab" class="tab" type="button">Hava</button>
        </nav>

        <div class="tft-frame" aria-label="TFT display preview">
          <div class="tft-screen">
            <div class="tft-topbar">
              <span id="previewTitle">SHOPPING LIST</span>
              <span id="itemCount">0</span>
            </div>
            <ol id="shoppingPreview" class="shopping-preview">
              <li class="empty">Liste bos</li>
            </ol>
            <div id="spotifyPreview" class="spotify-preview" hidden>
              <p id="spotifyTrack" class="track">Spotify baglanmadi</p>
              <p id="spotifyArtist" class="artist">Hesabini bagla ve switch'i ac</p>
              <p id="spotifyAlbum" class="album"></p>
            </div>
            <div id="weatherPreview" class="weather-preview" hidden>
              <div class="weather-current">
                <span id="weatherIcon" class="weather-icon">SUN</span>
                <div>
                  <p id="weatherTemp" class="weather-temp">-- C</p>
                  <p id="weatherLabel" class="weather-label">Hava bilgisi bekleniyor</p>
                </div>
              </div>
              <div id="weatherForecast" class="weather-forecast"></div>
            </div>
          </div>
        </div>

        <div id="shoppingControls" class="controls">
          <div class="composer">
            <input
              id="itemInput"
              type="text"
              maxlength="32"
              placeholder="Alisveris urunu yaz"
              autocomplete="off"
            />
            <button id="sendButton" type="button">Ekle</button>
          </div>
          <button id="clearButton" class="secondary-button" type="button">Listeyi Sifirla</button>
        </div>

        <div id="spotifyControls" class="controls" hidden>
          <a class="spotify-login" href="https://realtime-display.onrender.com/spotify/login" target="_blank" rel="noreferrer">
            Spotify Bagla
          </a>
          <button id="refreshSpotifyButton" class="secondary-button" type="button">Sarkiyi Yenile</button>
        </div>

        <div id="weatherControls" class="controls" hidden>
          <div class="coordinate-grid">
            <input id="weatherLat" type="number" step="0.0001" value="41.0082" aria-label="Latitude" />
            <input id="weatherLon" type="number" step="0.0001" value="28.9784" aria-label="Longitude" />
          </div>
          <button id="refreshWeatherButton" class="secondary-button" type="button">Havayi Yenile</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
